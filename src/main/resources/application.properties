spring.application.name=tevin-ai-backend

# OpenAI Configuration
spring.ai.openai.api-ley=${OPENAI_API_KEY}

# ============================================================
# OpenRouter API Configuration
# ============================================================

# API key used to authenticate requests to OpenRouter.
# The value is retrieved from the OPEN_ROUTER_API_KEY environment variable
# to avoid exposing sensitive credentials in source control.
spring.ai.openai.api-key=${OPEN_ROUTER_API_KEY}


# Base URL for OpenRouter's OpenAI-compatible API.
# Overrides the default OpenAI endpoint so requests go to OpenRouter.
spring.ai.openai.base-url=https://openrouter.ai/api/v1



# ============================================================
# Spring AI Chat Model Configuration
# ============================================================

# Specifies which AI model OpenRouter should use to process requests.
# The model identifier includes the provider and model name.
# You can change this to another supported OpenRouter model.
spring.ai.openai.chat.options.model=openrouter/free


# Controls the randomness of the AI model's responses.
# Lower values (e.g., 0.2) generally produce more consistent responses.
# Higher values (e.g., 0.9) generally produce more varied responses.
# Supported temperature ranges may differ between models.
spring.ai.openai.chat.options.temperature=0.7
